name: Korea Rates, News & Policy JSON Auto-Sync (30분 주기)

# 실행 방식
# - 주 트리거: Cloudflare Worker Cron(wrangler.jsonc, 매시 7·37분)이 workflow_dispatch 로 30분마다 실행
#   (GitHub 자체 schedule 은 지연·누락이 잦아 30분 주기가 실제로는 4~8시간 간격이 됐음)
# - 보조 트리거: GitHub schedule 3시간마다 (Cloudflare 쪽 토큰 만료 등에 대비한 안전망)
# 무료 한도
# - GitHub Actions: 공개 저장소는 표준 러너 무료
# - Cloudflare Workers Builds 무료: 월 3,000 빌드분 → "내용이 바뀐 경우에만" 커밋해 재배포 최소화
#   (최악의 경우 하루 48회 × 약 1분 ≈ 월 1,500분으로 한도 안)
on:
  workflow_dispatch: # Cloudflare Cron 이 호출 (GitHub Actions 탭에서 수동 실행도 가능)
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치지 않도록
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync-data-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Scrape live Korea rates, news & policies into JSON files
        run: node backend/scripts/syncDailyData.js

      - name: Commit only when content changed
        run: |
          if node backend/scripts/hasDataChanged.js; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add backend/data/rates_cache.json backend/data/policies_cache.json
            git commit -m "chore(data): auto-sync Korea interest rates, news & policies JSON"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          else
            echo "내용 변경이 없어 커밋·재배포하지 않습니다."
          fi
