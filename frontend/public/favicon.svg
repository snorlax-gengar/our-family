<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS-style Squircle Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Cozy House Outline & Roof -->
  <g filter="url(#shadow)">
    <!-- Chimney -->
    <rect x="41" y="16" width="6" height="10" rx="1.5" fill="#cbd5e1" />
    
    <!-- Roof Triangular Path -->
    <path d="M12 30 L32 14 L52 30" stroke="url(#roofGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- House Base Walls -->
    <path d="M18 29 L18 48 C18 50 19.5 51 21.5 51 L42.5 51 C44.5 51 46 50 46 48 L46 29" stroke="url(#roofGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="#1e1b4b" fill-opacity="0.25" />
    
    <!-- Warm Hearth Heart Emblem in the Center -->
    <path d="M32 44 C32 44 24 38.5 24 33.5 C24 30.5 26.5 28.5 29.5 28.5 C31 28.5 32 29.5 32 29.5 C32 29.5 33 28.5 34.5 28.5 C37.5 28.5 40 30.5 40 33.5 C40 38.5 32 44 32 44 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Golden Warm Sparkle Top Left -->
  <circle cx="16" cy="18" r="2" fill="#fbbf24" />
</svg>